# nginx config mirroring the gateway's /protected/* proxying, for
# scripts/bench-nginx.sh. Runs unprivileged: relative paths resolve
# against the -p prefix the script passes.
worker_processes 4;
daemon off;
pid nginx.pid;
error_log error.log warn;

events {
    worker_connections 4096;
}

http {
    access_log access.log;

    client_body_temp_path tmp/client_body;
    proxy_temp_path       tmp/proxy;
    fastcgi_temp_path     tmp/fastcgi;
    uwsgi_temp_path       tmp/uwsgi;
    scgi_temp_path        tmp/scgi;

    upstream backends {
        server 127.0.0.1:9001;
        server 127.0.0.1:9002;
        server 127.0.0.1:9003;
        # matches the gateway's MaxIdleConnsPerHost
        keepalive 100;
    }

    server {
        listen 127.0.0.1:8090;

        # trailing slash on proxy_pass strips the /protected prefix,
        # same as the gateway: /protected/secret -> /secret
        location /protected/ {
            proxy_pass http://backends/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
